name: Check signing logic
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s . -v
      - run: python3 -m py_compile sign_ipa.py
